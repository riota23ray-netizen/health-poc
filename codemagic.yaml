workflows:
  healthpoc-ios:
    name: HealthPoC iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "HealthPoC.xcodeproj"
        XCODE_SCHEME: "HealthPoC"
    scripts:
      - name: Build unsigned IPA
        script: |
          xcodebuild -project "$XCODE_PROJECT" \\
            -scheme "$XCODE_SCHEME" \\
            -configuration Release \\
            -sdk iphoneos \\
            -derivedDataPath build \\
            CODE_SIGNING_ALLOWED=NO \\
            CODE_SIGNING_REQUIRED=NO \\
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HealthPoC.app Payload/
          /usr/bin/zip -qry HealthPoC-unsigned.ipa Payload
    artifacts:
      - HealthPoC-unsigned.ipa
